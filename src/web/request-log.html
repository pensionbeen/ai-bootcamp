<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>API 요청 기록 · 서울시 조례 Q&amp;A</title>
  <style>
    :root { color-scheme: light; --ink: #18283b; --muted: #536578; --line: #d6dfe7; --blue: #185aa8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: var(--ink); font: 1rem/1.6 system-ui, "Malgun Gothic", sans-serif; }
    main { max-width: 1060px; margin: auto; padding: 28px 24px 64px; }
    nav, .toolbar, .pagination, .record-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    nav { margin-bottom: 24px; }
    a { color: var(--blue); text-underline-offset: 3px; }
    nav a { font-size: .9rem; }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1.3; letter-spacing: -.04em; }
    header p { color: var(--muted); margin-top: 8px; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, "Malgun Gothic", monospace; }
    .toolbar { margin: 22px 0 8px; }
    button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); font: 600 .9rem/1.5 system-ui, "Malgun Gothic", sans-serif; cursor: pointer; }
    button:hover:enabled { border-color: var(--blue); color: var(--blue); }
    button:disabled { opacity: .45; cursor: default; }
    #refresh { background: var(--blue); border-color: var(--blue); color: white; }
    label { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; cursor: pointer; }
    :focus-visible { outline: 3px solid #438ce1; outline-offset: 3px; }
    #summary, #updated, #refresh-note, .help, .record-meta { color: var(--muted); font-size: .85rem; }
    #updated { margin-left: auto; }
    #message { margin-top: 10px; }
    #message:empty { display: none; }
    #message.error { padding: 10px 14px; border-radius: 6px; background: #feeeee; color: #942a29; }
    #message.success { color: #205b41; }
    .count-row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin: 17px 0 10px; }
    #records { display: grid; gap: 10px; }
    .record { background: white; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .record.is-new { border-left: 4px solid var(--blue); }
    .record > summary { cursor: pointer; padding: 14px 17px; list-style: none; }
    .record > summary::-webkit-details-marker { display: none; }
    .record-meta { margin: 0 0 7px; pointer-events: none; }
    .record-meta::before { content: "›"; font-size: 1.1rem; font-weight: 700; line-height: 1; }
    .record[open] .record-meta::before { transform: rotate(90deg); }
    .record-meta > :last-child { margin-left: auto; }
    .kind { font-size: .75rem; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
    .status { font-size: .8rem; font-weight: 650; padding: 2px 7px; border-radius: 4px; }
    .status.ok { color: #205b41; background: #e6f4eb; }
    .status.bad { color: #942a29; background: #feeeee; }
    .status.wait { color: #77530b; background: #fff5d9; }
    .status.neutral { color: var(--muted); background: #eef2f6; }
    .question { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 650; overflow-wrap: anywhere; white-space: pre-wrap; margin-left: 22px; }
    .details { padding: 0 17px 17px; border-top: 1px solid var(--line); }
    dl { display: grid; grid-template-columns: 135px minmax(0, 1fr); gap: 5px 14px; margin: 14px 0; font-size: .85rem; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .json-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    h2 { font-size: .95rem; margin-bottom: 7px; }
    pre { font-size: .82rem; line-height: 1.65; background: #1b2b3b; color: #eef5ff; padding: 12px; border-radius: 5px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 540px; overflow-y: auto; }
    .help { margin-top: 14px; }
    #empty { padding: 36px 18px; text-align: center; background: white; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); }
    .pagination { margin-top: 18px; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) {
      main { padding: 18px 14px 38px; }
      .json-grid { grid-template-columns: minmax(0, 1fr); }
      .record-meta { gap: 6px; }
      .record-meta > :last-child { margin-left: 0; }
      #updated { margin-left: 0; width: 100%; }
      dl { grid-template-columns: 1fr; gap: 0; }
      dd { margin-bottom: 8px; }
    }
  </style>
  <script type="module" src="/request-log.mjs"></script>
</head>
<body>
  <main>
    <nav><a href="/">← 서울시 조례 묻고 답하기</a><a href="/test">API 테스트</a></nav>
    <header>
      <h1>API 요청 기록</h1>
      <p><code>POST /ask</code>에 들어온 질문과 반환한 JSON을 확인합니다. 시각은 한국 시간으로 표시합니다.</p>
    </header>
    <div class="toolbar">
      <button id="refresh" type="button">새로고침</button>
      <label><input id="auto-refresh" type="checkbox" checked>10초마다 새로고침</label>
      <span id="updated"></span>
    </div>
    <p id="refresh-note"></p>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="count-row"><p id="summary">기록을 불러오는 중입니다.</p></div>
    <section id="records" aria-label="요청 목록" aria-busy="true"></section>
    <p id="empty" hidden>아직 저장된 요청이 없습니다.</p>
    <div class="pagination" aria-label="기록 페이지">
      <button id="latest" type="button" disabled>최신 기록</button>
      <button id="newer" type="button" disabled>이전 페이지</button>
      <span id="page-number">1페이지</span>
      <button id="older" type="button" disabled>다음 페이지</button>
    </div>
    <p class="help">IP와 사용자 에이전트는 발신자 확인을 위한 참고 정보입니다. 주최 측에서 알려준 점검 시각·IP와 대조해 주세요.</p>
    <noscript>요청 기록을 보려면 브라우저에서 자바스크립트를 켜 주세요.</noscript>
    <template id="record-template">
      <details class="record">
        <summary>
          <div class="record-meta"><time></time><span class="kind"></span><span class="status"></span></div>
          <p class="question"></p>
        </summary>
        <div class="details">
          <dl></dl>
          <div class="json-grid">
            <section><h2 class="request-title">요청 내용</h2><pre class="request-json"></pre></section>
            <section><h2>응답 JSON</h2><pre class="response-json"></pre></section>
          </div>
        </div>
      </details>
    </template>
  </main>
</body>
</html>
